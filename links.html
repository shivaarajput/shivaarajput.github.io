<html lang="en" class="dark">
<head>

        <!-- Favicon -->

    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Outfit', 'sans-serif'] }, 
                    colors: { 
                        primary: '#0d9488',
                        dark: '#0f172a',
                        darker: '#020617'
                    },
                    animation: {
                        'spin-slow': 'spin 8s linear infinite',
                        'pulse-glow': 'pulse-glow 3s infinite',
                    },
                    keyframes: {
                        'pulse-glow': {
                            '0%, 100%': { boxShadow: '0 0 15px rgba(13, 148, 136, 0.2)' },
                            '50%': { boxShadow: '0 0 25px rgba(13, 148, 136, 0.6)' },
                        }
                    }
                } 
            } 
        }
    </script>
    
    <style>
        body { 
            transition: background-color 0.5s ease; 
            background-size: 400% 400%;
            /* Deep Space Gradient Animation */
            background-image: linear-gradient(-45deg, #020617, #0f172a, #111827, #0f172a);
            animation: gradientBG 15s ease infinite;
        }
        
        .light body {
            background-image: linear-gradient(-45deg, #f3f4f6, #e5e7eb, #f9fafb, #ffffff);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Holographic Glass Button */
        .glass-btn {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        /* Hover Effects (Dark) */
        .dark .glass-btn:hover {
            background: rgba(13, 148, 136, 0.1);
            border-color: #2dd4bf;
            box-shadow: 0 0 20px rgba(45, 212, 191, 0.4), inset 0 0 10px rgba(45, 212, 191, 0.1);
            transform: scale(1.03) translateY(-2px);
        }

        /* Hover Effects (Light) */
        html:not(.dark) .glass-btn {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0,0,0,0.05);
            color: #1f2937;
        }
        html:not(.dark) .glass-btn:hover {
            background: #fff;
            border-color: #0d9488;
            box-shadow: 0 10px 25px -5px rgba(13, 148, 136, 0.15);
            transform: scale(1.03) translateY(-2px);
        }

        /* Shining Sweep Effect */
        .glass-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }
        .glass-btn:hover::before { left: 100%; }

        /* Rotating Avatar Ring */
        .avatar-ring {
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #0d9488;
            border-bottom-color: #2dd4bf;
            animation: spin 8s linear infinite;
        }
        .avatar-ring::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-left-color: #3b82f6;
            border-right-color: #6366f1;
            animation: spin 12s linear infinite reverse;
        }

        /* Fade In Animation for Links */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.6s ease forwards; opacity: 0; }
    </style>
</head>
<!-- Flex col and justify-between ensures footer stays at bottom but doesn't overlap -->

    <!-- Canvas Background -->

    <!-- Main Content Wrapper -->

                <!-- Verified Badge -->

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
        import { getFirestore, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';

        // --- CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyCXxJ8102DXfA83-Z7QCRl4XZW0TmcOz5Y", 
            authDomain: "shivaarajput-68dd6.firebaseapp.com",
            projectId: "shivaarajput-68dd6",
            storageBucket: "shivaarajput-68dd6.firebasestorage.app",
            messagingSenderId: "685063111056",
            appId: "1:685063111056:web:8bb34eb5707cf5d1e0f315"
        };

        const config = (typeof __firebase_config !== 'undefined') ? JSON.parse(__firebase_config) : firebaseConfig;
        const app = initializeApp(config);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = 'my-portfolio';

        // URL Formatter
        function getLabel(url) {
            try {
                const hostname = new URL(url).hostname.replace('www.', '');
                const map = {
                    'linkedin': 'LinkedIn', 'github': 'GitHub', 'twitter': 'Twitter', 'x.com': 'Twitter',
                    'instagram': 'Instagram', 'youtube': 'YouTube', 'whatsapp': 'WhatsApp', 'wa.me': 'WhatsApp',
                    'medium': 'Medium', 'dev.to': 'Dev.to', 'facebook': 'Facebook', 'telegram': 'Telegram', 't.me': 'Telegram'
                };
                for (let key in map) { if(hostname.includes(key)) return map[key]; }
                return hostname.charAt(0).toUpperCase() + hostname.slice(1).split('.')[0]; 
            } catch (e) { return 'Website'; }
        }

        // Data Fetching
        signInAnonymously(auth).then(() => {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'content', 'main');
            onSnapshot(docRef, (snap) => {
                document.getElementById('loading-indicator').style.display = 'none';

                if(snap.exists()) {
                    const data = snap.data();
                    
                    if(data.personal) {
                        document.getElementById('avatar').src = data.personal.avatar || 'https://github.com/shivaarajput.png';
                        document.getElementById('name').innerText = data.personal.name || 'Shivam Kumar';
                        document.getElementById('desc').innerText = (data.personal.titles && data.personal.titles[0]) ? data.personal.titles[0] : 'Software Engineer';
                    }

                    const container = document.getElementById('links-container');
                    while (container.children.length > 1) { container.removeChild(container.lastChild); }

                    const socialLinks = data.personal?.social || [];
                    
                    if(socialLinks.length === 0) {
                        container.insertAdjacentHTML('beforeend', `<div class="text-center text-gray-500 italic py-4 animate-fade-in">Add links in Admin Panel</div>`);
                    }

                    socialLinks.forEach((link, index) => {
                        const label = getLabel(link.link);
                        let iconColor = "text-gray-400";
                        if(label === 'LinkedIn') iconColor = "text-blue-500";
                        if(label === 'GitHub') iconColor = "text-white";
                        if(label === 'Instagram') iconColor = "text-pink-500";
                        if(label === 'WhatsApp') iconColor = "text-green-500";
                        if(label === 'Twitter') iconColor = "text-blue-400";

                        const a = document.createElement('a');
                        a.href = link.link;
                        a.target = "_blank";
                        a.className = "glass-btn flex items-center justify-between px-6 py-4 rounded-xl group animate-fade-in";
                        a.style.animationDelay = `${(index + 1) * 0.1}s`; // Staggered animation
                        
                        a.innerHTML = `
                            <div class="flex items-center gap-4">
                                <span class="w-10 h-10 rounded-lg bg-gray-100 dark:bg-gray-800/80 flex items-center justify-center ${iconColor} shadow-inner group-hover:scale-110 transition-transform duration-300">
                                    <i class="${link.icon} text-xl"></i>
                                </span>
                                <span class="font-bold text-lg">${label}</span>
                            </div>
                            <i class="fas fa-arrow-up-right-from-square text-gray-400 group-hover:text-teal-500 text-sm transition-transform group-hover:translate-x-1 group-hover:-translate-y-1"></i>
                        `;
                        container.appendChild(a);
                    });
                }
            });
        }).catch(console.error);
    </script>

    <script>
        /* ==========================================
           PARTICLE STARFIELD (High Performance)
        ========================================== */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray;

        const resizeCanvas = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', () => { resizeCanvas(); init(); });

        let mouse = { x: null, y: null, radius: 200 };
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });

        class Particle {
            constructor(x, y, size, speedX, speedY) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.speedX = speedX;
                this.speedY = speedY;
                this.baseSize = size;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;

                // Mouse Interaction
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                
                if (distance < mouse.radius) {
                    if(this.size < this.baseSize * 3) this.size += 0.1; // Grow near mouse
                } else if (this.size > this.baseSize) {
                    this.size -= 0.1;
                }
            }
            draw() {
                const isDark = document.documentElement.classList.contains('dark');
                ctx.fillStyle = isDark ? 'rgba(255, 255, 255, 0.8)' : 'rgba(0, 0, 0, 0.5)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 8000;
            for(let i=0; i<numberOfParticles; i++) {
                let size = (Math.random() * 1.5) + 0.5;
                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;
                let speedX = (Math.random() * 0.5) - 0.25;
                let speedY = (Math.random() * 0.5) - 0.25;
                particlesArray.push(new Particle(x, y, size, speedX, speedY));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particlesArray.forEach(p => {
                p.update();
                p.draw();
            });
        }

        init();
        animate();

        // Theme Logic
        const themeBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            lightIcon.classList.remove('hidden');
            document.documentElement.classList.add('dark');
        } else {
            darkIcon.classList.remove('hidden');
            document.documentElement.classList.remove('dark');
        }

        themeBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            darkIcon.classList.toggle('hidden', !isDark);
            lightIcon.classList.toggle('hidden', isDark);
            localStorage.setItem('color-theme', isDark ? 'dark' : 'light');
        });
    </script>
</body>
